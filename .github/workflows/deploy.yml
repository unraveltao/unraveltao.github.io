name: Deploy to GitHub Pages

on:
  push:
    # 2026-11-01 起默认分支回到 main，react-rewrite 已删除
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # 测试只依赖 scripts/lib/content-rules.mjs 的纯函数，不读 .velite，可以放在构建之前
      - name: Test
        run: pnpm test
      # build 里已经串了 velite、内容校验、类型检查与后处理，这里不重复跑
      - name: Build
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # React Router 的静态产物在 build/client
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
