<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">三猴英语学习法：先诊断，再练习</title>
  <desc id="desc">阅读、听力、口语分别诊断，针对问题选择练习，再用没练过的新材料检查能否迁移。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f5f0e6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#65708b"/>
    </marker>
    <style>
      text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;fill:#202b42}
      .muted{fill:#68738a}.small{font-size:18px}.label{font-size:16px;font-weight:700;letter-spacing:2px}.title{font-size:34px;font-weight:700}.card-title{font-size:25px;font-weight:700}.body{font-size:18px}.step{font-size:20px;font-weight:700}
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="28" fill="url(#paper)"/>
  <circle cx="1080" cy="90" r="110" fill="#e6e7f4" opacity=".58"/>
  <circle cx="107" cy="690" r="100" fill="#f4dfd4" opacity=".55"/>
  <text x="70" y="70" class="label" fill="#6a5bb4">SANHOU · LEARNING MAP</text>
  <text x="70" y="122" class="title">先找到卡点，再选练习</text>
  <text x="70" y="158" class="small muted">三类能力分别诊断；练习之后，用新材料检验迁移。</text>

  <g transform="translate(70 205)">
    <rect width="330" height="205" rx="20" fill="#fff" stroke="#e5d9c9" stroke-width="2"/>
    <circle cx="48" cy="52" r="24" fill="#e8e2ff"/>
    <path d="M39 43h18v20H39zM43 48h10M43 53h10M43 58h7" fill="none" stroke="#6655b4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="59" class="card-title">阅读</text>
    <text x="28" y="108" class="label muted">先展示文字</text>
    <text x="28" y="144" class="body">概述意思，定位词汇、</text>
    <text x="28" y="174" class="body">句法或篇章理解困难。</text>
  </g>
  <g transform="translate(435 205)">
    <rect width="330" height="205" rx="20" fill="#fff" stroke="#d9e4dc" stroke-width="2"/>
    <circle cx="48" cy="52" r="24" fill="#dff1e8"/>
    <path d="M47 37a15 15 0 0 0-15 15v4a5 5 0 0 0 10 0v-4a5 5 0 0 0-10 0M47 37a15 15 0 0 1 15 15v4a5 5 0 0 1-10 0v-4a5 5 0 0 1 10 0M47 67h9" fill="none" stroke="#30785b" stroke-width="2.4" stroke-linecap="round"/>
    <text x="84" y="59" class="card-title">听力</text>
    <text x="28" y="108" class="label muted">先只播放声音</text>
    <text x="28" y="144" class="body">复述后再看文字，比较</text>
    <text x="28" y="174" class="body">声音识别与语言理解。</text>
  </g>
  <g transform="translate(800 205)">
    <rect width="330" height="205" rx="20" fill="#fff" stroke="#ead9d2" stroke-width="2"/>
    <circle cx="48" cy="52" r="24" fill="#ffe6dc"/>
    <path d="M34 44h27v18H46l-8 7v-7h-4zM41 50h13M41 56h9" fill="none" stroke="#a65b43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="59" class="card-title">口语</text>
    <text x="28" y="108" class="label muted">不给表达提示</text>
    <text x="28" y="144" class="body">在真实情境中观察组织、</text>
    <text x="28" y="174" class="body">选词、清晰度与回应。</text>
  </g>

  <path d="M235 410v44h730v-44" fill="none" stroke="#a5adbd" stroke-width="2.5" stroke-dasharray="6 7"/>
  <path d="M600 454v28" fill="none" stroke="#65708b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="520" text-anchor="middle" class="label" fill="#68738a">ONE EVIDENCE-BASED LOOP</text>

  <g transform="translate(65 550)">
    <rect width="235" height="118" rx="18" fill="#26324b"/>
    <text x="24" y="43" font-size="15" font-weight="700" letter-spacing="1.5" fill="#bbc7df">01 · DIAGNOSE</text>
    <text x="24" y="81" font-size="23" font-weight="700" fill="#fff">记录首次表现</text>
  </g>
  <path d="M302 609h28" stroke="#65708b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(337 550)">
    <rect width="235" height="118" rx="18" fill="#e8e2ff"/>
    <text x="24" y="43" class="label" fill="#6655b4">02 · PRACTICE</text>
    <text x="24" y="81" class="step">聚焦一个小目标</text>
  </g>
  <path d="M574 609h28" stroke="#65708b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(609 550)">
    <rect width="235" height="118" rx="18" fill="#dff1e8"/>
    <text x="24" y="43" class="label" fill="#30785b">03 · TRANSFER</text>
    <text x="24" y="81" class="step">换新材料再验证</text>
  </g>
  <path d="M846 609h28" stroke="#65708b" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(881 550)">
    <rect width="235" height="118" rx="18" fill="#ffe6dc"/>
    <text x="24" y="43" class="label" fill="#a65b43">04 · ITERATE</text>
    <text x="24" y="81" class="step">保留证据，调整方法</text>
  </g>
  <path d="M999 676v34H182v-28" fill="none" stroke="#65708b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="600" y="738" text-anchor="middle" class="small muted">一次练习是个人记录；是否有效，要看新材料上的表现。</text>
</svg>
